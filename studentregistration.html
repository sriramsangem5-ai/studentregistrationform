<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGISTRATION</title>
<style>
body {
    background-color: #96a3ab;
    font-family: Arial, sans-serif;
}

.form-container {
    box-sizing: border-box;
    width: 440px;
    max-width: calc(100% - 32px);
    margin: 40px auto;
    padding: 30px;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(23, 50, 77, 0.18);
}

h1 {
    text-align: center;
    color: #17324d;
    font-size: 32px;
    margin: 0 0 28px;
    transition: color 0.3s ease, transform 0.3s ease;
}

h1:hover {
    color: #f06464;
    transform: scale(1.05);
}

label {
    display: block;
    width: 90%;
    max-width: 340px;
    margin: 0 auto;
    color: #245b73;
    font-weight: bold;
    transition: color 0.3s ease;
}

label:hover {
    color: #f06464;
}

input {
    display: block;
    box-sizing: border-box;
    width: 90%;
    max-width: 340px;
    padding: 10px;
    margin: 7px auto 22px;
    color: #17324d;
    background-color: #ffffff;
    border: 1px solid #83b8c7;
    border-radius: 5px;
}

input:focus {
    border: 2px solid #159a91;
    outline: none;
    background-color: #effcf9;
}

input:valid {
    border-left: 4px solid #42a878;
}

input:invalid:focus {
    border-left: 4px solid #e35d6a;
}

label:nth-of-type(odd) {
    color: #17324d;
}

label:nth-of-type(even) {
    color: #159a91;
}

button {
    display: block;
    margin: 8px auto 0;
    padding: 10px 30px;
    background-color: #f06464;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

</style>
</head>
<body>
    <div class="form-container">
        <h1>Student Registration</h1>

        <label>Student Name:</label>
        <input type="text" name="studentName" id="studentName" required>
        <label>Student ID:</label>
        <input type="number" name="studentId" id="studentId" required>
        <label>Email:</label>
        <input type="email" name="email" id="email" required>
        <label>Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>

        <label>Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        <label>Address:</label>
        <input type="text" id="address" name="address" required>

        <button>Register</button>
    </div>
</body>
</html>
